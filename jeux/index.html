<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludopédagogie — l'épargne bancaire et le CAT</title>
<style>
  :root {
    --navy: #1F3864;
    --navy-soft: #4A5C82;
    --gold: #B08D57;
    --orange: #E0591F;
    --orange-soft: #FBEAE3;
    --teal: #168F7F;
    --teal-soft: #E3F3F1;
    --rouge: #C0392B;
    --rouge-soft: #FBE5E2;
    --vert: #2E8B57;
    --vert-soft: #E4F3EA;
    --bg: #F7F8FA;
    --white: #FFFFFF;
    --track: #E4E8EE;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background: var(--bg); font-family: Arial, Helvetica, sans-serif; color: var(--navy); }
  body { display:flex; justify-content:center; padding: 28px 14px 60px; }
  .page { width:100%; max-width: 980px; }

  header { text-align:center; margin-bottom: 20px; }
  header h1 { font-size: clamp(24px, 5vw, 30px); margin: 0 0 6px 0; }
  header p { font-size: 14.5px; color: var(--navy-soft); margin:0; }

  a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible {
    outline: 3px solid var(--navy) !important;
    outline-offset: 2px;
  }

  /* ---------- Onglets ---------- */
  .tabs {
    display:flex; overflow-x:auto; gap:8px; margin-bottom: 22px;
    padding-bottom: 6px; -webkit-overflow-scrolling: touch;
  }
  .tab-btn {
    flex-shrink:0; font-family:inherit; font-size:13.5px; font-weight:700;
    color: var(--navy-soft); background: var(--white); border:2px solid var(--track);
    border-radius: 999px; padding: 9px 16px; cursor:pointer; white-space:nowrap;
  }
  .tab-btn:hover { border-color: var(--navy-soft); }
  .tab-btn.active { background: var(--navy); border-color: var(--navy); color: #FFFFFF; }

  .tab-panel { display:none; }
  .tab-panel.active { display:block; }

  .panel-title { font-size: 20px; font-weight:800; color: var(--navy); margin: 0 0 4px 0; }
  .panel-sub { font-size: 13.5px; color: var(--navy-soft); margin: 0 0 18px 0; }

  .matching-section {
    padding: 22px 0 26px; border-bottom: 2px solid var(--track); margin-bottom: 22px;
  }
  .matching-section:last-child { border-bottom:none; margin-bottom:0; }
  .section-title { font-size: 17px; font-weight:800; color: var(--gold); margin: 0 0 4px 0; }

  /* ---------- Mots croises ---------- */
  .xword-layout { display:flex; flex-direction:column; gap: 22px; }
  .grid-wrap { overflow-x:auto; padding-bottom: 8px; }
  .xgrid { border-collapse: collapse; margin: 0 auto; }
  .xgrid td { width: 25px; height: 25px; padding:0; }
  .cell-black { background: transparent; }
  .cell-holder { position:relative; background: var(--white); border: 1px solid var(--navy); }
  .cell-holder .num {
    position:absolute; top:0; left:1px; font-size: 7px; font-weight:700; color: var(--navy-soft); line-height:1;
  }
  .cell-holder input {
    width:100%; height:100%; border:none; text-align:center; text-transform:uppercase;
    font-family:inherit; font-size: 13px; font-weight:700; color: var(--navy); background:transparent; padding:0;
  }
  .cell-holder input:focus { outline: none; background: var(--teal-soft); }
  .cell-holder.correct input { background: var(--vert-soft); color: var(--vert); }
  .cell-holder.incorrect input { background: var(--rouge-soft); color: var(--rouge); }

  .clues-cols { display:flex; gap: 28px; flex-wrap:wrap; }
  .clues-col { flex:1; min-width: 240px; }
  .clues-col h3 { font-size:15px; color: var(--navy); margin: 0 0 10px 0; }
  .clues-col ul { margin:0; padding-left: 4px; }
  .clues-col li { font-size: 13.5px; margin-bottom: 8px; line-height:1.4; }

  .xword-actions { display:flex; gap:12px; }
  .xword-actions > * { flex:1; }

  /* ---------- Appariement (relier par des lignes) ---------- */
  .connector-wrap { position: relative; margin-bottom: 18px; }
  .connector-svg { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
  .connector-cols { display:flex; justify-content:space-between; gap: 20%; position:relative; }
  .connector-col { display:flex; flex-direction:column; gap: 12px; width: 100%; max-width: 340px; }
  .connector-item {
    position:relative; background: var(--white); border:2px solid var(--track); border-radius:12px;
    padding: 12px 16px; font-size: 14px; font-weight:700; color: var(--navy); cursor:pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .connector-item:hover { border-color: var(--navy-soft); }
  .connector-item.pending { border-color: var(--gold); background: #FBF3E8; box-shadow: 0 0 0 3px rgba(176,141,87,0.25); }
  .connector-item.linked { border-color: var(--navy-soft); }
  .connector-item.correct { border-color: var(--vert); background: var(--vert-soft); }
  .connector-item.incorrect { border-color: var(--rouge); background: var(--rouge-soft); }
  .connector-dot {
    position:absolute; top:50%; width:10px; height:10px; border-radius:50%;
    background: var(--track); transform: translateY(-50%);
  }
  .connector-col.colA .connector-dot { right: -5px; }
  .connector-col.colB .connector-dot { left: -5px; }
  .connector-item.pending .connector-dot,
  .connector-item.linked .connector-dot { background: var(--gold); }
  .connector-item.correct .connector-dot { background: var(--vert); }
  .connector-item.incorrect .connector-dot { background: var(--rouge); }

  @media (max-width: 640px) {
    .connector-cols { flex-direction:column; gap: 28px; }
    .connector-col { max-width: none; }
    .connector-col.colA .connector-dot { right:auto; left:-5px; top:auto; bottom:-11px; transform:none; }
    .connector-col.colB .connector-dot { left:auto; right:-5px; top:-11px; transform:none; }
  }

  .connector-hint { font-size:12.5px; color: var(--navy-soft); font-style:italic; margin-bottom:14px; }

  .match-actions { display:flex; gap:12px; margin-top: 10px; }
  .match-actions > * { flex:1; }

  .btn-primary {
    font-family:inherit; font-size:14px; font-weight:700; color:#FFFFFF;
    background: var(--navy); border:none; border-radius:12px; padding:12px; cursor:pointer;
  }
  .btn-primary:hover { filter:brightness(1.15); }
  .btn-secondary {
    font-family:inherit; font-size:14px; font-weight:700; color:var(--navy-soft);
    background:var(--white); border:2px solid var(--track); border-radius:12px; padding:12px; cursor:pointer;
  }
  .btn-secondary:hover { border-color: var(--navy-soft); color: var(--navy); }

  .score-badge {
    display:inline-block; font-size: 13.5px; font-weight:700; color: var(--teal);
    background: var(--teal-soft); border-radius:999px; padding: 6px 14px; margin-bottom: 14px;
  }

  footer { text-align:center; font-size:12px; color:var(--navy-soft); margin-top: 30px; }

  .sr-only {
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  /* ---------- Memory ---------- */
  .memory-grid {
    display:grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px;
  }
  @media (max-width: 520px) { .memory-grid { grid-template-columns: repeat(2, 1fr); } }
  .memory-card {
    aspect-ratio: 1 / 0.85; perspective: 1000px; cursor:pointer;
  }
  .memory-card-inner {
    position:relative; width:100%; height:100%; transform-style:preserve-3d;
    transition: transform 0.4s ease;
  }
  .memory-card.flipped .memory-card-inner, .memory-card.found .memory-card-inner { transform: rotateY(180deg); }
  .memory-face {
    position:absolute; inset:0; backface-visibility:hidden; border-radius:12px;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:8px;
    font-size: 12px; font-weight:700; line-height:1.3;
  }
  .memory-face.back { background: var(--navy); color:#FFFFFF; font-size: 22px; }
  .memory-face.front { background: var(--white); border:2px solid var(--track); color: var(--navy); transform: rotateY(180deg); }
  .memory-card.found .memory-face.front { border-color: var(--vert); background: var(--vert-soft); }
  .memory-stats { display:flex; gap:20px; margin-bottom:14px; font-size:13.5px; color: var(--navy-soft); font-weight:700; }

  /* ---------- Tri par tiroirs ---------- */
  .sorting-pool {
    display:flex; flex-wrap:wrap; gap:10px; margin-bottom: 24px; padding: 16px;
    background: var(--white); border:2px dashed var(--track); border-radius:14px; min-height: 60px;
  }
  .sorting-chip {
    font-family:inherit; font-size:13px; font-weight:700; color:var(--navy);
    background: var(--orange-soft); border:2px solid var(--orange); border-radius:999px;
    padding: 8px 14px; cursor:pointer;
  }
  .sorting-chip.selected { background: var(--gold); border-color: var(--gold); color:#FFFFFF; }
  .sorting-drawers { display:grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom:18px; }
  @media (max-width: 620px) { .sorting-drawers { grid-template-columns: 1fr; } }
  .sorting-drawer {
    background: var(--white); border:2px solid var(--track); border-radius:14px; padding: 12px 14px;
    min-height: 70px; cursor:pointer;
  }
  .sorting-drawer:hover { border-color: var(--navy-soft); }
  .sorting-drawer .drawer-label { font-size:13.5px; font-weight:800; color: var(--navy); margin-bottom:8px; }
  .sorting-drawer .drawer-items { display:flex; flex-wrap:wrap; gap:6px; }
  .sorting-drawer .drawer-chip {
    font-size:12px; font-weight:700; background: var(--teal-soft); color: var(--teal);
    border-radius:999px; padding:5px 10px; cursor:pointer;
  }
  .sorting-drawer .drawer-chip.correct { background: var(--vert-soft); color: var(--vert); }
  .sorting-drawer .drawer-chip.incorrect { background: var(--rouge-soft); color: var(--rouge); }

  /* ---------- Textes a trous ---------- */
  .trous-section { padding: 20px 0 24px; border-bottom: 2px solid var(--track); margin-bottom:20px; }
  .trous-section:last-child { border-bottom:none; margin-bottom:0; }
  .trous-header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:4px; flex-wrap:wrap; }
  .trous-header .section-title { margin-bottom:0; }
  .btn-speak {
    flex-shrink:0; font-family:inherit; font-size:13px; font-weight:700; color: var(--teal);
    background: var(--teal-soft); border:2px solid var(--teal); border-radius:999px;
    padding: 7px 14px; cursor:pointer;
  }
  .btn-speak:hover { filter:brightness(0.97); }
  .btn-speak.speaking { background: var(--teal); color:#FFFFFF; }
  .trous-text { font-size:15px; line-height:2.1; color: var(--navy); margin-bottom:12px; }
  .trous-text input {
    width: 100px; font-family:inherit; font-size:14px; font-weight:700; color:var(--navy);
    border:none; border-bottom: 2px solid var(--gold); background: var(--orange-soft);
    text-align:center; padding: 3px 4px; border-radius: 4px 4px 0 0;
  }
  .trous-text input:focus { outline:none; border-bottom-color: var(--navy); }
  .trous-text input.correct { background: var(--vert-soft); border-bottom-color: var(--vert); color: var(--vert); }
  .trous-text input.incorrect { background: var(--rouge-soft); border-bottom-color: var(--rouge); color: var(--rouge); }
  .trous-banque { font-size:12.5px; color: var(--navy-soft); margin-bottom:14px; }
  .trous-banque strong { color: var(--navy); }

  /* Sur telephone, les cases des mots croises deviennent trop etroites
     pour le doigt. On leur garde une taille utilisable et on laisse la
     grille defiler horizontalement. */
  @media (max-width: 900px) {
    .crossword-wrap, .grid-wrap, .mc-wrap {
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      padding-bottom: 6px;
    }
    .cell-holder { min-width: 28px; min-height: 28px; }
    .cell-holder input { font-size: 15px; }
  }

  /* ---------- la barre d'accessibilite ---------- */
  .a11y-bar {
    display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
    background:var(--white); border:2px solid var(--track); border-radius:14px;
    padding:12px 16px; margin-bottom:24px;
  }
  /* une fois que l'apprenant descend dans la page, la barre reste accessible en haut.
     Version compacte : elle ne doit pas manger l'ecran, surtout sur telephone. */
  .a11y-bar.figee {
    position:fixed; top:8px; left:50%; transform:translateX(-50%);
    width:calc(100% - 20px); max-width:860px; z-index:1400;
    padding:8px 12px; gap:7px; margin-bottom:0;
    box-shadow:0 4px 18px rgba(31,56,100,0.18);
  }
  .a11y-bar.figee .a11y-toggle-btn { font-size:12px; padding:6px 11px; }
  .a11y-bar.figee .a11y-bar-label { font-size:12px; }
  .a11y-bar.figee .a11y-size-group { font-size:12px; }
  .a11y-bar.figee .a11y-size-group button { width:30px; height:30px; font-size:13px; }

  /* sur telephone, l'ecran est etroit : on reduit encore pour laisser voir le contenu */
  @media (max-width: 620px) {
    .a11y-bar.figee { padding:6px 8px; gap:5px; top:5px; }
    .a11y-bar.figee .a11y-toggle-btn { font-size:11px; padding:5px 9px; }
    .a11y-bar.figee .a11y-bar-label { font-size:11px; }
    .a11y-bar.figee .a11y-size-group { font-size:11px; gap:4px; }
    .a11y-bar.figee .a11y-size-group button { width:28px; height:28px; font-size:12px; }
  }
  /* remplace la barre dans le flux, pour que le contenu ne remonte pas d'un coup */
  .a11y-bar-espace { display:none; }
  .a11y-bar-espace.actif { display:block; }
  .a11y-bar-label { font-size:13px; font-weight:800; color:var(--navy); margin-right:4px; }
  .a11y-toggle-btn {
    font-family:inherit; font-size:13px; font-weight:700; color:var(--navy-soft);
    background:var(--white); border:2px solid var(--track); border-radius:999px;
    padding:8px 14px; cursor:pointer;
  }
  .a11y-toggle-btn:hover { border-color:var(--navy-soft); }
  .a11y-toggle-btn[aria-pressed="true"] { background:var(--navy); border-color:var(--navy); color:#FFFFFF; }
  .a11y-size-group { display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--navy); }
  .a11y-size-group button {
    font-family:inherit; font-weight:800; font-size:14px; color:var(--navy);
    background:var(--white); border:2px solid var(--navy-soft); border-radius:8px;
    width:34px; height:34px; cursor:pointer;
  }
  .a11y-size-group button:hover { border-color:var(--navy); }
  .tts-btn {
    font-family:inherit; font-size:13px; font-weight:700; color:var(--teal);
    background:var(--teal-soft); border:2px solid var(--teal); border-radius:999px;
    padding:8px 16px; cursor:pointer; display:block; margin:0 auto 24px;
  }
  .tts-btn:hover { background:var(--teal); color:#FFFFFF; }
  .tts-btn:disabled { opacity:0.5; cursor:not-allowed; }


  /* la barre s'adapte aux petits ecrans, sans deborder */
  .a11y-bar { max-width: 100%; box-sizing: border-box; }
  @media (max-width: 640px) {
    .a11y-bar { padding: 9px 8px; gap: 6px; margin: 8px; }
    .a11y-toggle-btn { font-size: 12px; padding: 8px 10px; }
    .a11y-bar-label { font-size: 12px; }
  }

  /* ---------- reglages d'accessibilite ---------- */

  /* alleger les animations : plus aucune transition ni animation */
  body.anim-allegee *,
  body.anim-allegee *::before,
  body.anim-allegee *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }

  /* le reglage systeme du navigateur fait de meme */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

  /* on saute la barre pour aller droit aux jeux */
  .lien-evitement {
    position: fixed; left: -9999px; top: 0; z-index: 999;
    background: var(--navy); color: #FFFFFF; font-weight: 700;
    padding: 12px 20px; border-radius: 0 0 12px 0; text-decoration: none;
    font-size: calc(14px * var(--a11y-scale));
  }
  .lien-evitement:focus { left: 0; outline: 3px solid var(--gold); outline-offset: -3px; }

  /* la barre reste accessible pendant tout le defilement */
  .a11y-bar { position: sticky; top: 0; z-index: 500; box-shadow: 0 4px 14px -4px rgba(31,56,100,0.32); }

  /* sur telephone, les zones tactiles s'agrandissent */
  @media (max-width: 560px) {
    .a11y-bar { padding: 9px 10px; gap: 7px; }
  }

  .retour-arcade {
    display:inline-flex; align-items:center; gap:7px; margin:14px 0 18px;
    font-size:calc(14px * var(--a11y-scale)); font-weight:700;
    color:var(--navy-soft); background:#FFFFFF;
    border:2px solid var(--track, #8592B0); border-radius:999px;
    padding:11px 20px; text-decoration:none; min-height:44px;
  }
  .retour-arcade:hover { border-color:var(--navy); color:var(--navy); }
  .retour-arcade:focus-visible { outline:3px solid var(--gold, #B08D57); outline-offset:3px; }
  body.a11y-contrast .retour-arcade { border-color:#000000; color:#000000; }

  /* le bandeau qui salue un jeu termine */
  .bandeau-reussite {
    position: fixed; left: 50%; bottom: 24px; z-index: 1000;
    transform: translateX(-50%) translateY(20px);
    background: linear-gradient(160deg, #7E5CB8 0%, #5E3E96 55%, #2A1848 100%);
    color: #FFFFFF; font-size: calc(14px * var(--a11y-scale)); font-weight: 700;
    padding: 13px 22px; border-radius: 999px; border: 2px solid #12161E;
    box-shadow: 0 8px 24px rgba(0,0,0,0.42);
    opacity: 0; pointer-events: none; max-width: calc(100vw - 32px); text-align: center;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .bandeau-reussite.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion: reduce) { .bandeau-reussite { transition: none; } }

  /* ============================================================
     LE QUIZ — une borne d'arcade tenue par Ludo
     ============================================================ */
  /* les trois vues du quiz : jouer, comprendre, relire les regles */
  .quiz-sous-onglets {
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
    max-width: 620px; margin: 0 auto 16px;
  }
  .quiz-sous-btn {
    font-family: inherit; font-size: calc(13.5px * var(--a11y-scale)); font-weight: 700;
    color: var(--navy-soft, #4A5C82); background: #FFFFFF;
    border: 2px solid var(--track, #8592B0); border-radius: 999px;
    padding: 10px 18px; cursor: pointer; min-height: 44px;
  }
  .quiz-sous-btn:hover { border-color: var(--navy); color: var(--navy); }
  .quiz-sous-btn:focus-visible { outline: 3px solid var(--gold, #B08D57); outline-offset: 3px; }
  .quiz-sous-btn.active {
    color: #FFFFFF; background: linear-gradient(160deg, #5E4098 0%, #3A2068 100%);
    border-color: #2A1848;
  }
  .quiz-vue[hidden] { display: none; }
  body.a11y-contrast .quiz-sous-btn { border-color: #000000; color: #000000; }
  body.a11y-contrast .quiz-sous-btn.active { background: #000000; border-color: #000000; color: #FFFFFF; }
  @media (max-width: 560px) {
    .quiz-sous-onglets { flex-direction: column; }
    .quiz-sous-btn { width: 100%; }
  }

  /* la notice de la borne : comment jouer, et les regles */
  .quiz-notice {
    max-width: 620px; margin: 0 auto 20px;
    background: var(--white); border: 2px solid var(--track, #8592B0);
    border-radius: 16px; padding: 16px 18px;
  }
  .quiz-notice-titre {
    font-size: calc(15px * var(--a11y-scale)); font-weight: 800;
    color: var(--navy); margin: 0 0 8px;
  }
  .quiz-notice-titre + .quiz-notice-liste { margin-bottom: 14px; }
  .quiz-notice-liste {
    margin: 0 0 4px; padding-left: 22px;
    font-size: calc(13.5px * var(--a11y-scale)); line-height: 1.6; color: var(--navy-soft, #4A5C82);
  }
  .quiz-notice-liste li { margin-bottom: 5px; }
  .quiz-notice-liste strong { color: var(--navy); }
  .quiz-notice-clavier {
    font-size: calc(12.5px * var(--a11y-scale)); color: var(--navy-soft, #4A5C82);
    margin: 10px 0 0; padding-top: 10px; border-top: 1.5px dashed var(--track, #8592B0);
    line-height: 1.6;
  }
  .quiz-notice-clavier kbd {
    background: #F2F5FA; border: 1px solid var(--track, #8592B0); border-radius: 5px;
    padding: 1px 6px; font-family: inherit; font-size: 0.95em; font-weight: 700; color: var(--navy);
  }
  body.a11y-contrast .quiz-notice { border-color: #000000; }
  body.a11y-contrast .quiz-notice-titre,
  body.a11y-contrast .quiz-notice-liste,
  body.a11y-contrast .quiz-notice-liste strong,
  body.a11y-contrast .quiz-notice-clavier { color: #000000; }

  /* La borne reprend le volume du personnage : une face eclairee a gauche,
     un flanc qui fuit vers la droite, et l'arete verticale entre les deux. */
  .quiz-borne {
    position: relative; max-width: 620px; margin: 0 auto;
    border-radius: 22px; padding: 18px 30px 14px 18px;
    background:
      /* le grain du plastique */
      radial-gradient(1.5px 1.5px at 12% 24%, rgba(255,255,255,0.05) 50%, transparent 50%),
      radial-gradient(1.5px 1.5px at 68% 72%, rgba(255,255,255,0.04) 50%, transparent 50%),
      radial-gradient(1.5px 1.5px at 88% 36%, rgba(0,0,0,0.06) 50%, transparent 50%),
      /* le flanc droit, plus sombre, comme une face qui fuit */
      linear-gradient(to right,
        rgba(0,0,0,0) 0%, rgba(0,0,0,0) 86%,
        rgba(0,0,0,0.28) 88%, rgba(0,0,0,0.5) 100%),
      /* la face, eclairee depuis le haut-gauche */
      linear-gradient(160deg, #A88CDC 0%, #9878D0 12%, #7E5CB8 30%,
                              #5E3E96 52%, #42286E 78%, #2A1848 100%);
    border: 3px solid #12161E;
    box-shadow:
      inset 4px 4px 0 rgba(216,200,246,0.45),
      inset -4px -4px 0 rgba(0,0,0,0.5),
      inset 0 0 34px rgba(0,0,0,0.26),
      0 6px 12px -3px rgba(10,8,20,0.42),
      0 18px 36px -8px rgba(10,8,20,0.58),
      0 30px 50px -14px rgba(10,8,20,0.4);
  }
  /* l'arete lumineuse du dessus */
  .quiz-borne::before {
    content: ""; position: absolute; left: 18px; right: 30px; top: 3px; height: 2.5px;
    border-radius: 2px; background: rgba(226,210,250,0.6); pointer-events: none;
  }
  /* l'arete verticale, la ou la face rencontre le flanc, et les vis */
  .quiz-borne::after {
    content: ""; position: absolute; inset: 10px; border-radius: 16px; pointer-events: none;
    background:
      linear-gradient(to right, transparent 0 calc(100% - 26px),
                      rgba(216,200,246,0.28) calc(100% - 26px) calc(100% - 24px),
                      transparent calc(100% - 24px)),
      radial-gradient(circle 3px at 0 0,       #9A88B8 60%, transparent 62%),
      radial-gradient(circle 3px at 100% 0,    #6E5C8C 60%, transparent 62%),
      radial-gradient(circle 3px at 0 100%,    #9A88B8 60%, transparent 62%),
      radial-gradient(circle 3px at 100% 100%, #6E5C8C 60%, transparent 62%);
  }

  /* la dalle */
  .quiz-ecran {
    position: relative; border-radius: 14px; overflow: hidden;
    padding: 14px 84px 20px; min-height: 210px;
    background: radial-gradient(120% 90% at 50% 22%, #14514A 0%, #0C3A36 44%, #071F1E 100%);
    border: 2px solid #061614; padding-bottom: 62px;
    box-shadow:
      inset 0 0 40px rgba(0,0,0,0.6),
      inset 0 0 14px rgba(63,203,170,0.22),
      inset 0 4px 10px rgba(0,0,0,0.5),
      0 0 0 2px rgba(200,180,236,0.16),
      0 -2px 0 rgba(0,0,0,0.4);
  }
  .quiz-ecran::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background: repeating-linear-gradient(to bottom,
      rgba(255,255,255,0.045) 0 1px, rgba(0,0,0,0) 1px 4px);
  }
  .quiz-ecran::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2; border-radius: 14px;
    background: radial-gradient(115% 100% at 50% 45%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.45) 100%);
  }
  .quiz-ecran > *:not(.quiz-oeil):not(.quiz-bouche) { position: relative; z-index: 3; }

  /* ---------- le visage de Ludo, derriere le quiz ---------- */
  .quiz-oeil {
    position: absolute; top: 62px; width: 62px; height: auto;
    opacity: 0.9; pointer-events: none; z-index: 1;
    filter: drop-shadow(0 3px 10px rgba(0,0,0,0.6));
  }
  .quiz-oeil-g { left: 6px; }
  .quiz-oeil-d { right: 6px; }
  .quiz-bouche {
    position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%);
    width: 160px; height: auto; opacity: 0.3; pointer-events: none; z-index: 1;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
  }

  .quiz-regard {
    transform-box: view-box; transform-origin: 30px 32px;
    animation: quiz-regarde 7.2s ease-in-out infinite;
  }
  @keyframes quiz-regarde {
    0%, 8%    { transform: translate(0, 0); }
    16%, 24%  { transform: translate(6px, 2px); }
    32%       { transform: translate(2px, -4px); }
    40%, 48%  { transform: translate(-6px, 2px); }
    56%       { transform: translate(-2px, -4.5px); }
    64%, 72%  { transform: translate(5px, -4px); }
    80%, 88%  { transform: translate(-5px, 3px); }
    96%, 100% { transform: translate(0, 0); }
  }
  .quiz-paupiere {
    transform-box: fill-box; transform-origin: center;
    animation: quiz-cligne 6.2s ease-in-out infinite;
  }
  .quiz-paupiere-d { animation-delay: 0.07s; }
  @keyframes quiz-cligne {
    0%, 88%, 100% { transform: scaleY(1); }
    91%, 94%      { transform: scaleY(0.08); }
    96%           { transform: scaleY(1); }
  }
  .quiz-sourcil {
    transform-box: view-box; transform-origin: 29px 6px;
    animation: quiz-sourcils 10.4s ease-in-out infinite;
    transition: transform 0.3s ease;
  }
  .quiz-sourcil-d { transform-origin: 31px 6px; animation-delay: 0.12s; }
  @keyframes quiz-sourcils {
    0%, 40%, 100% { transform: translateY(0)    rotate(0deg); }
    48%, 62%      { transform: translateY(-4px) rotate(-2deg); }
  }
  .quiz-sourire {
    transform-box: view-box; transform-origin: 110px 24px;
    animation: quiz-parle 7.4s ease-in-out infinite;
  }
  @keyframes quiz-parle {
    0%    { transform: scale(1, 1); }
    5%    { transform: scale(0.97, 1.5); }
    9%    { transform: scale(1.02, 0.8); }
    14%   { transform: scale(0.98, 1.35); }
    19%   { transform: scale(1.01, 0.85); }
    24%   { transform: scale(0.97, 1.55); }
    29%   { transform: scale(1, 1); }
    49%   { transform: scale(0.98, 1.4); }
    54%   { transform: scale(1.02, 0.82); }
    59%   { transform: scale(0.97, 1.6); }
    64%   { transform: scale(1.01, 0.9); }
    74%   { transform: scale(1, 1); }
    86%, 94% { transform: scale(1.07, 1.18); }
    100%  { transform: scale(1, 1); }
  }

  /* Ludo se rejouit d'une bonne reponse */
  .quiz-ecran.ludo-content .quiz-sourire {
    animation: quiz-rejouit 1.4s ease-in-out;
  }
  @keyframes quiz-rejouit {
    0%       { transform: scale(1, 1); }
    25%      { transform: scale(1.16, 1.5); }
    50%      { transform: scale(1.1, 1.32); }
    75%      { transform: scale(1.18, 1.55); }
    100%     { transform: scale(1, 1); }
  }
  .quiz-ecran.ludo-content .quiz-oeil { opacity: 0.5; }
  .quiz-ecran.ludo-content .quiz-sourcil { transform: translateY(-5px); }

  /* Ludo marque le coup sur une erreur : la bouche s'aplatit */
  .quiz-ecran.ludo-decu .quiz-levre { d: path("M18 26 Q110 14 202 26"); }
  .quiz-ecran.ludo-decu .quiz-levre-ombre { d: path("M18 28 Q110 16 202 28"); }
  .quiz-ecran.ludo-decu .quiz-levre-reflet { d: path("M34 27 Q110 18 186 27"); }
  .quiz-ecran.ludo-decu .quiz-sourire { animation: none; }
  .quiz-ecran.ludo-decu .quiz-sourcil { transform: translateY(3px) rotate(4deg); }
  .quiz-ecran.ludo-decu .quiz-sourcil-d { transform: translateY(3px) rotate(-4deg); }

  @media (prefers-reduced-motion: reduce) {
    .quiz-regard, .quiz-paupiere, .quiz-sourcil, .quiz-sourire { animation: none !important; }
    .quiz-sourcil { transition: none !important; }
  }
  body.anim-allegee .quiz-regard,
  body.anim-allegee .quiz-paupiere,
  body.anim-allegee .quiz-sourcil,
  body.anim-allegee .quiz-sourire { animation: none !important; }
  body.anim-allegee .quiz-sourcil { transition: none !important; }

  /* le bandeau du haut : progression et série */
  .quiz-entete {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
  }
  .quiz-compteur {
    font-size: calc(13.5px * var(--a11y-scale)); font-weight: 800; color: #A8FFF0;
  }
  .quiz-serie {
    font-size: calc(13px * var(--a11y-scale)); font-weight: 700; color: #F0C020;
  }
  .quiz-serie[hidden] { display: none; }
  .quiz-jauge {
    height: 10px; border-radius: 999px; overflow: hidden; width: 100%;
    background: rgba(255,255,255,0.14); border: 1.5px solid rgba(255,255,255,0.3);
    margin-bottom: 16px;
  }
  .quiz-jauge-remplie {
    height: 100%; border-radius: 999px; width: 0;
    background: linear-gradient(90deg, #3FCBAA 0%, #7FFFE8 100%);
    transition: width 0.35s ease;
  }

  .quiz-question {
    font-size: calc(17px * var(--a11y-scale)); font-weight: 700; line-height: 1.5;
    color: #FFFFFF; text-align: center; margin: 0 0 6px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  .quiz-consigne {
    font-size: calc(12.5px * var(--a11y-scale)); font-style: italic;
    color: #9FD8CE; text-align: center; margin: 0;
  }

  /* les manettes : une couleur par réponse */
  .quiz-manettes {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
    margin-top: 16px; margin-bottom: 8px;
  }
  .quiz-manette {
    display: flex; align-items: center; gap: 12px; text-align: left;
    font-family: inherit; font-size: calc(14.5px * var(--a11y-scale)); font-weight: 700;
    color: #FFFFFF; padding: 12px 14px; border-radius: 16px; cursor: pointer;
    min-height: 60px; line-height: 1.4;
    border: 2.5px solid #12161E;
    box-shadow:
      inset 2px 2px 0 rgba(255,255,255,0.24),
      inset -2px -2px 0 rgba(0,0,0,0.36),
      0 4px 10px -2px rgba(0,0,0,0.45);
    transition: transform 0.14s ease, filter 0.14s ease;
  }
  .quiz-manette:hover:not(:disabled) { filter: brightness(1.12); }
  .quiz-manette:active:not(:disabled) { transform: translateY(2px); }
  .quiz-manette:focus-visible { outline: 3px solid #F0C020; outline-offset: 3px; }
  .quiz-manette:disabled { cursor: default; }

  /* le bouton rond, comme sur la console */
  .quiz-pastille {
    flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 800; color: #FFFFFF;
    border: 2px solid rgba(0,0,0,0.45);
    box-shadow: inset 2px 2px 0 rgba(255,255,255,0.4), inset -2px -2px 0 rgba(0,0,0,0.3);
  }

  .quiz-m1 { background: linear-gradient(160deg, #B8342A 0%, #8A1E14 100%); }
  .quiz-m2 { background: linear-gradient(160deg, #8A6008 0%, #614204 100%); }
  .quiz-m3 { background: linear-gradient(160deg, #14705C 0%, #0A4A3C 100%); }
  .quiz-m4 { background: linear-gradient(160deg, #5E4098 0%, #3A2068 100%); }
  .quiz-m1 .quiz-pastille { background: #E8483A; }
  .quiz-m2 .quiz-pastille { background: #C08C0E; }
  .quiz-m3 .quiz-pastille { background: #1E9E82; }
  .quiz-m4 .quiz-pastille { background: #7E5CB8; }

  /* après la réponse */
  .quiz-manette.juste {
    background: linear-gradient(160deg, #1E9E82 0%, #0A5C4A 100%);
    border-color: #7FFFE8;
    box-shadow: inset 2px 2px 0 rgba(255,255,255,0.3), 0 0 18px rgba(63,203,170,0.6);
  }
  .quiz-manette.fausse {
    background: linear-gradient(160deg, #8A2A20 0%, #5A1810 100%);
    border-color: #E8483A; opacity: 0.9;
  }
  .quiz-manette.eteinte { opacity: 0.4; }
  .quiz-verdict {
    margin: 14px 0 0; padding: 12px 14px; border-radius: 12px;
    font-size: calc(14px * var(--a11y-scale)); font-weight: 700; text-align: center;
    background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.24); color: #FFFFFF;
  }
  .quiz-verdict[hidden] { display: none; }

  /* la jauge de confiance : le cœur de Dunning-Kruger */
  .quiz-confiance {
    margin-top: 16px; padding: 12px 14px; border-radius: 14px;
    background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.22);
    text-align: center;
  }
  .quiz-confiance[hidden] { display: none; }
  .quiz-confiance-titre {
    font-size: calc(13.5px * var(--a11y-scale)); font-weight: 700; color: #FFFFFF; margin: 0 0 10px;
  }
  .quiz-confiance-choix { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .quiz-confiance-choix button {
    font-family: inherit; font-size: calc(13.5px * var(--a11y-scale)); font-weight: 700;
    color: #0C3A36; background: #A8FFF0; border: 2px solid #061614;
    border-radius: 999px; padding: 11px 18px; cursor: pointer; min-height: 48px;
  }
  .quiz-confiance-choix button:hover { filter: brightness(1.08); }
  .quiz-confiance-choix button:focus-visible { outline: 3px solid #F0C020; outline-offset: 3px; }

  /* la proposition visee par le joystick */
  .quiz-manette.visee {
    outline: 3px solid #F0C020; outline-offset: 3px;
    filter: brightness(1.14);
  }
  .quiz-joy-zone, .quiz-bouton-zone { cursor: pointer; }
  .quiz-joy-zone:focus-visible, .quiz-bouton-zone:focus-visible {
    outline: 3px solid #F0C020; outline-offset: 2px;
  }
  #quizJoyTige { transition: transform 0.22s cubic-bezier(.34,1.3,.64,1); }
  @media (prefers-reduced-motion: reduce) { #quizJoyTige { transition: none !important; } }
  body.anim-allegee #quizJoyTige { transition: none !important; }

  /* le tableau de bord, sous la dalle */
  .quiz-bord { margin: 14px auto 2px; max-width: 100%; display: block; }
  .quiz-bord svg { width: 100%; height: auto; display: block; }
  .quiz-joystick {
    transform-box: view-box; transform-origin: 62px 52px;
    animation: bord-manette 5.6s ease-in-out infinite;
  }

  /* le bilan de fin */
  .quiz-bilan { text-align: center; }
  .quiz-bilan[hidden] { display: none; }
  .quiz-bilan-score {
    font-size: calc(30px * var(--a11y-scale)); font-weight: 800; color: #FFFFFF;
    margin: 0 0 6px; text-shadow: 0 0 16px rgba(127,255,232,0.7);
  }
  .quiz-bilan-mot {
    font-size: calc(15px * var(--a11y-scale)); color: #A8FFF0; margin: 0 0 14px; line-height: 1.55;
  }
  .quiz-bilan-lucidite {
    font-size: calc(13.5px * var(--a11y-scale)); color: #FFFFFF; line-height: 1.6;
    background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.24);
    border-radius: 12px; padding: 12px 14px; margin: 0 0 16px; text-align: left;
  }
  .quiz-bilan-lucidite strong { color: #F0C020; }
  .quiz-bilan-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .quiz-bilan-actions button {
    font-family: inherit; font-size: calc(14px * var(--a11y-scale)); font-weight: 700;
    border-radius: 999px; padding: 12px 22px; cursor: pointer; min-height: 48px;
    color: #FFFFFF; background: linear-gradient(160deg, #7E5CB8 0%, #5E3E96 55%, #2A1848 100%);
    border: 2px solid #12161E;
  }
  .quiz-bilan-actions button.secondaire {
    color: #0C3A36; background: #A8FFF0; border-color: #061614;
  }
  .quiz-bilan-actions button:hover { filter: brightness(1.1); }
  .quiz-bilan-actions button:focus-visible { outline: 3px solid #F0C020; outline-offset: 3px; }

  @media (max-width: 560px) {
    /* Sur telephone, l'ecran est trop etroit pour loger les yeux sans
       empieter sur le texte. Seul le sourire reste : il suffit a signaler
       la presence de Ludo, et la lecture reste nette. */
    .quiz-oeil { display: none; }
    .quiz-bouche { width: 150px; bottom: 2px; }
    .quiz-manettes { grid-template-columns: 1fr; }
    .quiz-borne { padding: 14px 20px 12px 12px; }
    .quiz-ecran { padding: 14px 12px 44px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .quiz-jauge-remplie, .quiz-manette { transition: none !important; }
    .quiz-joystick { animation: none !important; }
  }
  body.anim-allegee .quiz-jauge-remplie,
  body.anim-allegee .quiz-manette { transition: none !important; }
  body.anim-allegee .quiz-joystick { animation: none !important; }

  /* ---------- mode FALC : phrases courtes, texte simplifie ---------- */
  .falc-simple-content { display: none; }
  body.falc-mode .falc-normal-content { display: none; }
  body.falc-mode .falc-simple-content { display: block; }
  /* le texte respire davantage */
  body.falc-mode .panel-sub,
  body.falc-mode .panel-intro p,
  body.falc-mode .quiz-notice-liste,
  body.falc-mode .quiz-question,
  body.falc-mode .quiz-manette { line-height: 1.85; }
  body.falc-mode .quiz-consigne { font-style: normal; font-size: calc(13.5px * var(--a11y-scale)); }

  /* ---------- contraste renforcé sur la borne de quiz ---------- */
  /* La dalle passe au noir et les textes au blanc pur : c'est là que se joue
     le quiz, c'est donc là que le besoin est le plus fort. */
  body.a11y-contrast .quiz-borne {
    background: #000000; border-color: #FFFFFF;
  }
  body.a11y-contrast .quiz-ecran {
    background: #000000; border-color: #FFFFFF;
  }
  body.a11y-contrast .quiz-ecran::before,
  body.a11y-contrast .quiz-ecran::after { display: none; }
  body.a11y-contrast .quiz-question,
  body.a11y-contrast .quiz-compteur,
  body.a11y-contrast .quiz-consigne { color: #FFFFFF; }
  body.a11y-contrast .quiz-consigne { font-style: normal; }

  /* les manettes : fond noir, texte blanc, la couleur ne sert plus qu'à la pastille */
  body.a11y-contrast .quiz-manette {
    background: #000000; border-color: #FFFFFF; color: #FFFFFF;
  }
  body.a11y-contrast .quiz-manette.visee {
    outline-color: #FFFF00; outline-width: 4px;
  }
  body.a11y-contrast .quiz-manette.juste {
    background: #000000; border-color: #00FF88; border-width: 4px;
  }
  body.a11y-contrast .quiz-manette.fausse {
    background: #000000; border-color: #FF6060; border-width: 4px;
  }
  body.a11y-contrast .quiz-pastille { border-color: #FFFFFF; border-width: 3px; }

  body.a11y-contrast .quiz-jauge { background: #333333; border-color: #FFFFFF; }
  body.a11y-contrast .quiz-jauge-remplie { background: #FFFFFF; }
  body.a11y-contrast .quiz-verdict,
  body.a11y-contrast .quiz-confiance {
    background: #000000; border-color: #FFFFFF; color: #FFFFFF;
  }
  body.a11y-contrast .quiz-confiance-titre { color: #FFFFFF; }
  body.a11y-contrast .quiz-bilan-score,
  body.a11y-contrast .quiz-bilan-mot,
  body.a11y-contrast .quiz-bilan-lucidite { color: #FFFFFF; }
  body.a11y-contrast .quiz-bilan-lucidite { background: #000000; border-color: #FFFFFF; }
  /* le visage de Ludo s'efface : il gênerait la lecture à fort contraste */
  body.a11y-contrast .quiz-oeil,
  body.a11y-contrast .quiz-bouche { display: none; }

</style>

<div class="a11y-bar" id="a11yBar" role="region" aria-label="Options d'accessibilité">

<script>
const MATCHING_DATA = [
  {
    "seq": 1,
    "title": "PEL et CEL : les durées",
    "instruction": "Relie chaque produit à sa durée minimale d'épargne.",
    "colA": [
      "Phase épargne minimale du PEL",
      "Phase épargne minimale du CEL",
      "Durée maximale de la phase épargne du PEL",
      "Durée maximale d'un prêt épargne logement"
    ],
    "colB": [
      "Trois ans",
      "Dix-huit mois",
      "Dix ans",
      "Quinze ans"
    ]
  },

(function () {

    { id: 'xword', label: '🧩 Mots croisés' },

    { id: 'trous', label: '✏️ Textes à trous' },
    { id: 'quiz', label: '❓ Quiz' },
  ];

  tabsList.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
    btn.textContent = t.label;
    btn.setAttribute('role', 'tab');
    btn.dataset.tab = t.id;
    btn.addEventListener('click', () => activateTab(t.id));
    tabsEl.appendChild(btn);
  });

  function activateTab(id) {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + id));
  }

  function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ===================== ONGLET MOTS CROISES =====================
  function buildCrosswordPanel() {
    const panel = document.createElement('div');
    panel.className = 'tab-panel active';
    panel.id = 'panel-xword';

    const cellMap = {};
    CROSSWORD.cells.forEach(c => { cellMap[c.r + '_' + c.c] = c; });

    let gridHtml = '<table class="xgrid"><tbody>';
    for (let r = 0; r < CROSSWORD.rows; r++) {
      gridHtml += '<tr>';
      for (let c = 0; c < CROSSWORD.cols; c++) {
        const cell = cellMap[r + '_' + c];
        if (!cell) {
          gridHtml += '<td class="cell-black"></td>';
        } else {
          const numHtml = cell.num ? `<span class="num">${cell.num}</span>` : '';
          gridHtml += `<td class="cell-holder" data-r="${r}" data-c="${c}" data-letter="${cell.letter}">${numHtml}<input maxlength="1" aria-label="Case ligne ${r+1} colonne ${c+1}"></td>`;
        }
      }
      gridHtml += '</tr>';
    }
    gridHtml += '</tbody></table>';

    let cluesH = '<div class="clues-col"><h2>➡️ Horizontal</h2><ul style="list-style:none;padding-left:0;">';
    CROSSWORD.cluesH.forEach(cl => { cluesH += `<li><strong>${cl.num}.</strong> ${escapeHtml(cl.clue)}</li>`; });
    cluesH += '</ul></div>';

    let cluesV = '<div class="clues-col"><h2>⬇️ Vertical</h2><ul style="list-style:none;padding-left:0;">';
    CROSSWORD.cluesV.forEach(cl => { cluesV += `<li><strong>${cl.num}.</strong> ${escapeHtml(cl.clue)}</li>`; });
    cluesV += '</ul></div>';

    panel.innerHTML = `
      <div class="panel-title">Mots croisés — l'épargne bancaire et le CAT</div>
      <div class="panel-sub"><span class="falc-normal-content">15 mots-clés du module. Clique sur une case pour écrire une lettre.</span><span class="falc-simple-content">Il y a 15 mots à trouver.<br>Clique sur une case.<br>Écris une lettre.</span></div>
      <div class="xword-layout">
        <div class="grid-wrap">${gridHtml}</div>
        <div class="clues-cols">${cluesH}${cluesV}</div>

      </div>

  <a aria-label="Retour à l'Arcade — retour à l'arcade" title="Retour à l'Arcade" class="retour-arcade" href="../">← Retour à l'Arcade</a>

    `;
    panelsEl.appendChild(panel);

    panel.querySelector('#xwordCheck').addEventListener('click', () => {
      let justes = 0, total = 0;
        panel.querySelectorAll('.cell-holder').forEach(td => {
          total++;
        const input = td.querySelector('input');
        const val = input.value.trim().toUpperCase();
        td.classList.remove('correct', 'incorrect');
        if (!val) return;
        if (val === td.dataset.letter) { td.classList.add('correct'); justes++; }
        else td.classList.add('incorrect');
      
        if (total > 0 && justes === total) signalerJeuReussi('xword');
      });
    });
    panel.querySelector('#xwordReset').addEventListener('click', () => {
      panel.querySelectorAll('.cell-holder').forEach(td => {
        td.querySelector('input').value = '';
        td.classList.remove('correct', 'incorrect');
      });
    });
    panel.querySelector('#xwordSolve').addEventListener('click', () => {
      if (!confirm('Révéler toute la solution ?')) return;
      panel.querySelectorAll('.cell-holder').forEach(td => {
        td.querySelector('input').value = td.dataset.letter;
        td.classList.remove('incorrect');
        td.classList.add('correct');
      });
    });

    // navigation clavier simple (fleches)
    panel.querySelectorAll('.cell-holder input').forEach(inp => {
      inp.addEventListener('input', () => {
        inp.value = inp.value.toUpperCase();
        if (inp.value) {
          const td = inp.closest('td');
          const r = parseInt(td.dataset.r, 10), c = parseInt(td.dataset.c, 10);
          const next = panel.querySelector(`.cell-holder[data-r="${r}"][data-c="${c+1}"] input`);
          if (next) next.focus();
        }
      });
    });
  }

  function wireMatchingSection(panel, m) {
    const wrap = panel.querySelector('.connector-wrap');
    const svg = panel.querySelector('.connector-svg');
    let connections = {}; // aIdx -> bIdx
    let pendingA = null;

    function dotCenter(item, side) {
      const dot = item.querySelector('.connector-dot');
      const dr = dot.getBoundingClientRect();
      const wr = wrap.getBoundingClientRect();
      return { x: dr.left + dr.width / 2 - wr.left, y: dr.top + dr.height / 2 - wr.top };
    }

    function itemFor(side, idx) {
      return panel.querySelector(`.connector-item[data-side="${side}"][data-idx="${idx}"]`);
    }

    function redraw(stateClasses) {
      svg.innerHTML = '';
      Object.keys(connections).forEach(aIdx => {
        const bIdx = connections[aIdx];
        const aItem = itemFor('A', aIdx), bItem = itemFor('B', bIdx);
        if (!aItem || !bItem) return;
        const p1 = dotCenter(aItem, 'A'), p2 = dotCenter(bItem, 'B');
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', p1.x); line.setAttribute('y1', p1.y);
        line.setAttribute('x2', p2.x); line.setAttribute('y2', p2.y);
        let color = '#B08D57';
        if (stateClasses) {
          if (stateClasses[aIdx] === 'correct') color = '#2E8B57';
          else if (stateClasses[aIdx] === 'incorrect') color = '#C0392B';
        }
        line.setAttribute('stroke', color);
        line.setAttribute('stroke-width', '2.5');
        line.setAttribute('stroke-linecap', 'round');
        svg.appendChild(line);
      });
    }

    function clearItemStates() {
      panel.querySelectorAll('.connector-item').forEach(el => el.classList.remove('pending', 'linked', 'correct', 'incorrect'));
    }

    function refreshLinkedClasses() {
      panel.querySelectorAll('.connector-item').forEach(el => el.classList.remove('linked'));
      Object.keys(connections).forEach(aIdx => {
        itemFor('A', aIdx).classList.add('linked');
        itemFor('B', connections[aIdx]).classList.add('linked');
      });
    }

    function selectA(idx) {
      panel.querySelectorAll('.connector-item[data-side="A"]').forEach(el => el.classList.remove('pending'));
      pendingA = idx;
      itemFor('A', idx).classList.add('pending');
    }

    function connectTo(bIdx) {
      if (pendingA === null) return;
      connections[pendingA] = bIdx;
      itemFor('A', pendingA).classList.remove('pending');
      pendingA = null;
      refreshLinkedClasses();
      redraw();
    }

    panel.querySelectorAll('.connector-item[data-side="A"]').forEach(el => {
      el.addEventListener('click', () => selectA(parseInt(el.dataset.idx, 10)));
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectA(parseInt(el.dataset.idx, 10)); } });
    });
    panel.querySelectorAll('.connector-item[data-side="B"]').forEach(el => {
      el.addEventListener('click', () => connectTo(parseInt(el.dataset.idx, 10)));
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); connectTo(parseInt(el.dataset.idx, 10)); } });
    });

    panel.querySelector('[data-action="check"]').addEventListener('click', () => {
      const stateClasses = {};
      let correctCount = 0;
      const total = m.colA.length;
      clearItemStates();
      refreshLinkedClasses();
      Object.keys(connections).forEach(aIdx => {
        const isCorrect = connections[aIdx] === m.correct[aIdx];
        stateClasses[aIdx] = isCorrect ? 'correct' : 'incorrect';
        if (isCorrect) correctCount++;
        itemFor('A', aIdx).classList.add(stateClasses[aIdx]);
        itemFor('B', connections[aIdx]).classList.add(stateClasses[aIdx]);
      });
      redraw(stateClasses);
      const badge = panel.querySelector('.score-badge');
      badge.style.display = 'inline-block';
      badge.textContent = `${correctCount} / ${total} bonnes réponses`;
        if (total > 0 && correctCount === total) signalerJeuReussi('matching');
    });

    panel.querySelector('[data-action="reset"]').addEventListener('click', () => {
      connections = {};
      pendingA = null;
      clearItemStates();
      svg.innerHTML = '';
      panel.querySelector('.score-badge').style.display = 'none';
    });

    window.addEventListener('resize', () => redraw());
  }

  function buildMemoryPanel() {
    const panel = document.createElement('div');
    panel.className = 'tab-panel';
    panel.id = 'panel-memory';
    panel.innerHTML = `
      <div class="panel-title">Memory — question / réponse</div>
      <div class="panel-sub"><span class="falc-normal-content">Retrouve les 8 paires question / réponse en retournant deux cartes à la fois.</span><span class="falc-simple-content">Retourne deux cartes.<br>Trouve la question et sa réponse.<br>Il y a 8 paires.</span></div>
      <div class="memory-stats"><span id="memMoves">Coups : 0</span><span id="memFound">Paires trouvées : 0 / 8</span></div>
      <div class="memory-grid" id="memoryGrid"></div>
      <div class="match-actions"><button class="btn-secondary" id="memReset">↺ Nouvelle partie</button></div>
    `;
    panelsEl.appendChild(panel);

    const grid = panel.querySelector('#memoryGrid');
    const movesEl = panel.querySelector('#memMoves');
    const foundEl = panel.querySelector('#memFound');
    let moves = 0, found = 0, flipped = [], lock = false;

    function buildDeck() {
      let deck = [];
      MEMORY_DATA.forEach(pair => {
        deck.push({ seq: pair.seq, text: pair.q, kind: 'q' });
        deck.push({ seq: pair.seq, text: pair.a, kind: 'a' });
      });
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      return deck;
    }

    function render() {
      moves = 0; found = 0; flipped = []; lock = false;
      movesEl.textContent = 'Coups : 0';
      foundEl.textContent = 'Paires trouvées : 0 / 8';
      const deck = buildDeck();
      grid.innerHTML = '';
      deck.forEach((card, i) => {
        const el = document.createElement('div');
        el.className = 'memory-card';
        el.dataset.index = i;
        el.dataset.seq = card.seq;
        el.innerHTML = `
          <div class="memory-card-inner">
            <div class="memory-face back">?</div>
            <div class="memory-face front">${escapeHtml(card.text)}</div>
          </div>`;
        el.addEventListener('click', () => onCardClick(el));
        grid.appendChild(el);
      });
    }

    function onCardClick(el) {
      if (lock) return;
      if (el.classList.contains('flipped') || el.classList.contains('found')) return;
      if (flipped.length === 2) return;
      el.classList.add('flipped');
      flipped.push(el);
      if (flipped.length === 2) {
        moves++;
        movesEl.textContent = 'Coups : ' + moves;
        const [a, b] = flipped;
        if (a.dataset.seq === b.dataset.seq) {
          a.classList.add('found'); b.classList.add('found');
          found++;
          foundEl.textContent = `Paires trouvées : ${found} / 8`;
          flipped = [];
          if (found === 8) signalerJeuReussi('memory');
        } else {
          lock = true;
          setTimeout(() => {
            a.classList.remove('flipped'); b.classList.remove('flipped');
            flipped = []; lock = false;
          }, 900);
        }
      }
    }

    panel.querySelector('#memReset').addEventListener('click', render);
    render();
  }

      drawersHtml += `

          <div class="drawer-label">📁 Séquence ${d.seq} — ${escapeHtml(d.label)}</div>
          <div class="drawer-items"></div>
        </div>`;
    });

      <div class="panel-title">Tri par tiroirs</div>
      <div class="panel-sub"><span class="falc-normal-content">Clique un terme, puis le tiroir (la partie du cours) où il doit être rangé. Clique un terme déjà rangé pour le reprendre.</span><span class="falc-simple-content">Clique sur un mot.<br>Puis clique sur le bon tiroir.<br>Pour reprendre un mot, clique dessus.</span></div>
      <div class="score-badge" style="display:none;"></div>
      <div class="sorting-pool" id="sortingPool">${poolHtml}</div>
      <div class="sorting-drawers" id="sortingDrawers">${drawersHtml}</div>
      <div class="match-actions">
        <button class="btn-secondary" data-action="reset">↺ Recommencer</button>
        <button class="btn-primary" data-action="check">✓ Vérifier</button>
      </div>
    `;
    panelsEl.appendChild(panel);

    const pool = panel.querySelector('#sortingPool');
    const drawersHolder = panel.querySelector('#sortingDrawers');
    let placement = {}; // termIdx -> seq (tiroir choisi)
    let selectedTerm = null;

    function renderPool() {
      pool.querySelectorAll('.sorting-chip').forEach(chip => {
        const idx = parseInt(chip.dataset.idx, 10);
        chip.style.display = placement.hasOwnProperty(idx) ? 'none' : '';
        chip.classList.toggle('selected', selectedTerm === idx);
      });
    }
    function renderDrawers(stateClasses) {
      drawersHolder.querySelectorAll('.sorting-drawer').forEach(dEl => {
        const seq = parseInt(dEl.dataset.seq, 10);
        const itemsEl = dEl.querySelector('.drawer-items');
        itemsEl.innerHTML = '';
        Object.keys(placement).forEach(idxStr => {
          const idx = parseInt(idxStr, 10);
          if (placement[idx] !== seq) return;
          const term = SORTING_TERMS[idx];
          const chip = document.createElement('span');
          chip.className = 'drawer-chip';
          if (stateClasses && stateClasses[idx]) chip.classList.add(stateClasses[idx]);
          chip.textContent = term.term;
          chip.addEventListener('click', () => {
            delete placement[idx];
            selectedTerm = null;
            renderPool(); renderDrawers();
          });
          itemsEl.appendChild(chip);
        });
      });
    }

    pool.addEventListener('click', e => {
      const chip = e.target.closest('.sorting-chip');
      if (!chip) return;
      selectedTerm = parseInt(chip.dataset.idx, 10);
      renderPool();
    });
    drawersHolder.addEventListener('click', e => {
      const drawer = e.target.closest('.sorting-drawer');
      if (!drawer || e.target.closest('.drawer-chip')) return;
      if (selectedTerm === null) return;
      placement[selectedTerm] = parseInt(drawer.dataset.seq, 10);
      selectedTerm = null;
      renderPool(); renderDrawers();
    });

    panel.querySelector('[data-action="check"]').addEventListener('click', () => {
      const stateClasses = {};
      let correctCount = 0;
      Object.keys(placement).forEach(idxStr => {
        const idx = parseInt(idxStr, 10);
        const isCorrect = placement[idx] === SORTING_TERMS[idx].seq;
        stateClasses[idx] = isCorrect ? 'correct' : 'incorrect';
        if (isCorrect) correctCount++;
      });
      renderDrawers(stateClasses);
      const badge = panel.querySelector('.score-badge');
      badge.style.display = 'inline-block';
      badge.textContent = `${correctCount} / ${SORTING_TERMS.length} bien rangés (${Object.keys(placement).length} placés au total)`;
        if (correctCount === SORTING_TERMS.length) signalerJeuReussi('sorting');
    });
    panel.querySelector('[data-action="reset"]').addEventListener('click', () => {
      placement = {}; selectedTerm = null;
      panel.querySelector('.score-badge').style.display = 'none';
      renderPool(); renderDrawers();
    });

    renderPool(); renderDrawers();
  }

  function normalizeAnswer(s) {
    return s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function buildTrousPanel() {
    const panel = document.createElement('div');
    panel.className = 'tab-panel';
    panel.id = 'panel-trous';

    let sectionsHtml = '';
    TROUS_DATA.forEach(t => {
      const textHtml = escapeHtml(t.text).replace(/([①②③④⑤⑥])___/g, (m, circ) => {
        const n = "①②③④⑤⑥".indexOf(circ);
        return `${circ}<input type="text" data-seq="${t.seq}" data-n="${n}" aria-label="Réponse ${n+1}, séquence ${t.seq}">`;

          <div class="score-badge" style="display:none;"></div>
          <div class="match-actions">
            <button class="btn-secondary" data-action="reset">↺ Effacer</button>
            <button class="btn-primary" data-action="check">✓ Vérifier</button>
          </div>
        </div>`;
    });

    panel.innerHTML = `
      <div class="panel-title">Textes à trous</div>
      <div class="panel-sub"><span class="falc-normal-content">Complète chaque synthèse avec le mot qui convient (accents et majuscules non requis).</span><span class="falc-simple-content">Écris le mot qui manque.<br>Les accents ne sont pas obligatoires.</span></div>
      <div id="trousSections">${sectionsHtml}</div>
    `;
    panelsEl.appendChild(panel);

    const speechSupported = 'speechSynthesis' in window;
    let currentUtterance = null;

    function toSpeakable(text) {
      return text.replace(/[①②③④⑤⑥]___/g, ' , blanc , ');
    }

    TROUS_DATA.forEach(t => {
      const section = panel.querySelector(`.trous-section[data-seq="${t.seq}"]`);
      const speakBtn = section.querySelector('[data-action="speak"]');

      if (!speechSupported) {
        speakBtn.style.display = 'none';
      } else {
        speakBtn.addEventListener('click', () => {
          if (window.speechSynthesis.speaking) {
            window.speechSynthesis.cancel();
            speakBtn.textContent = '🔊 Écouter';
            speakBtn.classList.remove('speaking');
            return;
          }
          const utter = new SpeechSynthesisUtterance(toSpeakable(t.text));
          utter.lang = 'fr-FR';
          utter.rate = 0.95;
          utter.onstart = () => { speakBtn.textContent = '⏸ Arrêter'; speakBtn.classList.add('speaking'); };
          utter.onend = () => { speakBtn.textContent = '🔊 Écouter'; speakBtn.classList.remove('speaking'); };
          utter.onerror = () => { speakBtn.textContent = '🔊 Écouter'; speakBtn.classList.remove('speaking'); };
          currentUtterance = utter;
          window.speechSynthesis.speak(utter);
        });
      }

      section.querySelector('[data-action="check"]').addEventListener('click', () => {
        let correctCount = 0;
        const inputs = section.querySelectorAll('input');
        inputs.forEach(inp => {
          const n = parseInt(inp.dataset.n, 10);
          const ok = normalizeAnswer(inp.value) === normalizeAnswer(t.answers[n]);
          inp.classList.remove('correct', 'incorrect');
          if (!inp.value.trim()) return;
          if (ok) { inp.classList.add('correct'); correctCount++; }
          else inp.classList.add('incorrect');
        });
        const badge = section.querySelector('.score-badge');
        badge.style.display = 'inline-block';
        badge.textContent = `${correctCount} / ${inputs.length} bonnes réponses`;
        if (inputs.length > 0 && correctCount === inputs.length) signalerJeuReussi('trous');
      });
      section.querySelector('[data-action="reset"]').addEventListener('click', () => {
        section.querySelectorAll('input').forEach(inp => { inp.value = ''; inp.classList.remove('correct', 'incorrect'); });
        section.querySelector('.score-badge').style.display = 'none';
      });
    });
  }
